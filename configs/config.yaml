# filename: config.yaml
# 这个版本的配置文件恢复了所有旧版配置文件的核心功能，并与我们的多模型消融实验方案完全兼容。
# --- 路径配置 ---
paths:
  raw_radar: "J:/云雷达基数据及同址地面数据/2025云雷达基数据[数据集25站]/{station}/{day}"
  raw_labels: "J:/云雷达基数据及同址地面数据/2025云雷达标签数据[数据集25站]/{station}/{month}.csv"
  raw_surf: "J:/云雷达基数据及同址地面数据/2025云雷达地面数据[数据集25站]/{station}/{station}_{start_time}_{end_time}.csv"
  std_labels: "J:/质控框架B/三合一工程/input/label/{station}/{yearmonth}.csv"
  station_features: "../configs/station_features.csv"

# --- 全局站点与日期 ---标签标准化、preprocess受此影响
#stations: ["50953","51839","52267","52533","52836","53772","53845","54161","54623","56173","56312","56492","56651",
#"56691","56778","57083","57461","57516","58150","58424","58633","58847","59211","59280","59316"]
stations: ["56187"]
start: "2025-05-01"
end: "2025-10-31"

# --- 雷达数据类型编码 ---
data_type:
  1: 'Z1'
  2: 'V1'
  3: 'W1'
  34: 'LDR'
  43: 'CF' # 雷达自身质控算法的杂波标志位

# --- 数据集与采样策略配置 ---
dataset:
  stations: ["50953","51839","52267","52533","52836","53772","53845","54161","54623","56173","56312","56492","56651",
"56691","56778","57083","57461","57516","58150","58424","58633","58847","59211","59280","59316"]
#  stations: ['54823']
  root_dir: "J:/质控框架B/三合一工程/data/radar"
  start: "2024-05-18"
  end: "2024-05-18"
  window_size: 240
  stride: 60
  height: 500
  train_ratio: 0.9
  h_true_max_bin: 200.0
  resample_rate_minutes: 1 #地面数据归一化时用到的采样率，单位分钟

  monthly_split:
    seed: 42

  valid_ranges:
    Z: [-60, 70]
    V: [ -40, 40 ]
    W: [ 0, 15 ]
    LDR: [ -40, 40 ]
    TEM: [-60, 60]
    RHU: [0, 100]
    PRE: [0, 100]

  difficulty_weights:
    balance: 0.3
    Z: 0.05
    TEM: 0.05
    RHU: 0.05
    PRE: 0.05
    max_overlap: 0.25
    temporal_transition: 0.25

  season_factors:
      summer: 1.5
      winter: 0.8
      spring: 1.2
      autumn: 1.0
geo_encoder:
  embedding_dim: 8
  # 定义送入编码器的物理特征向量构成顺序 (已更新)
  input_features:
    - 'lon_dec'
    - 'lat_dec'
    - 'alt'
    - 'distance_to_coastline'
    - 'complexity_10km'
    - 'complexity_50km'
    - 'complexity_100km'
    - 'mean_temp'
    - 'mean_rhu'
    - 'mean_pre'
    - 'mean_pre_days'
  # 显式定义哪些特征是月度数据
  monthly_features:
    - 'mean_temp'
    - 'mean_rhu'
    - 'mean_pre'
    - 'mean_pre_days'
# --- 模型超参数配置 ---
model:
  name: 'baseline+surf+lcl' # 可选值: 'baseline', 'baseline+surf', 'baseline+surf+lcl'
#  stack_name: 'baseline'
  in_ch: 5 # 雷达特征4+h_norm1
  physics_input_dim: 3
  physics_embedding_dim: 16
  pe_dim: 10  # [新增] 位置编码维度，控制垂直方向的特征分辨率
# --- 训练策略配置 ---
train:
  num_workers: 0
  batch_size: 8
  learning_rate: 0.0001
  epochs: 25
  lambda_lcl: 1.0
  model_save_path: "./checkpoints"
  val_dates_output_path: "./val_sets/验证集.txt"
  early_stopping_patience: 10
  use_amp: false # 启用混合精度训练
  dynamic_lcl:
    enable: false          # 设置为 true 来启用动态权重
    clamping_range: [0.5, 1.5] # [min_ratio, max_ratio]

inference:
  # 设置为 true 可直接对 datasplit.npz 中的验证集进行推理
  # 此时将忽略下面的 stations, start_date, end_date
  use_train_set: false
  use_validation_set: false
  # 控制参数
  enable_plotting: true       # 是否生成对比图
  enable_evaluation: false        # 是否计算指标并生成Excel

#  stations: ["50953","51839","52267","52533","52836","53772","53845","54161","54623","56173","56312","56492","56651",
#"56691","56778","57083","57461","57516","58150","58424","58633","58847","59211","59280","59316"]
  stations: ["54623"]
  start_date: "2025-09-02"     # 推理开始日期
  end_date: "2025-09-02"        # 推理结束日期
  output_dir: "./inference_results" # 所有输出的总目录
  num_workers: 6               # 使用的进程数

  # 算法超参数
  structure_size: [ 3, 3 ]          # 形态学滤波核大小 [H, W]
  safety_margin: 15               # ECH上的安全裕度(库数)
  # 绘图列表 ---
  ech_gt_method: 'connectivity' #默认连通域法计算ECH真值.其他可选值：density代表垂直密度阈值法 ；Percentile代表98百分位法
  plots_to_show: # 控制生成图片包含哪些子图
    - "original"
#    - "human_label"
    - "model_only"
    - "final"
    - "ECH_curve"
#    - "LCL"
#    - 'ECH_true'